<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Summarizer - Mini SaaS</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            padding: 40px;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
            resize: vertical;
            min-height: 150px;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .result-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #e0e0e0;
            display: none;
        }

        .result-section.show {
            display: block;
        }

        .result-label {
            color: #333;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .result-box {
            background: #f5f5f5;
            padding: 15px;
            border-radius: 8px;
            color: #333;
            line-height: 1.6;
            min-height: 100px;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
            font-size: 14px;
            margin-top: 10px;
        }

        .loading.show {
            display: block;
        }

        .error {
            display: none;
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 14px;
        }

        .error.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📝 Text Summarizer</h1>
        <p class="subtitle">Résumez votre texte en un clic</p>

        <form id="summarizeForm">
            <div class="form-group">
                <label for="textInput">Texte à résumer</label>
                <textarea 
                    id="textInput" 
                    placeholder="Collez votre texte ici..."
                    required
                ></textarea>
            </div>

            <button type="submit" id="submitBtn">Résumer le texte</button>

            <div class="loading" id="loading">
                ⏳ Résumé en cours...
            </div>

            <div class="error" id="error"></div>
        </form>

        <div class="result-section" id="resultSection">
            <div class="result-label">Résumé généré</div>
            <div class="result-box" id="resultBox"></div>
        </div>
    </div>

    <script>
        const form = document.getElementById('summarizeForm');
        const textInput = document.getElementById('textInput');
        const submitBtn = document.getElementById('submitBtn');
        const loading = document.getElementById('loading');
        const error = document.getElementById('error');
        const resultSection = document.getElementById('resultSection');
        const resultBox = document.getElementById('resultBox');

        const API_URL = 'http://localhost:8000';

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const text = textInput.value.trim();

            if (!text) {
                showError('Veuillez entrer du texte à résumer');
                return;
            }

            // Réinitialiser l'état
            error.classList.remove('show');
            resultSection.classList.remove('show');
            loading.classList.add('show');
            submitBtn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/summarize`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ text }),
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || `Erreur serveur: ${response.status}`);
                }

                const data = await response.json();
                resultBox.textContent = data.summary;
                resultSection.classList.add('show');
            } catch (err) {
                showError(`Erreur: ${err.message}`);
            } finally {
                loading.classList.remove('show');
                submitBtn.disabled = false;
            }
        });

        function showError(message) {
            error.textContent = message;
            error.classList.add('show');
        }
    </script>
</body>
</html>
